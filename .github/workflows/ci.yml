name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check / lint (residual informational)
        continue-on-error: true
        run: bun run check || bun run lint || true
      - name: Test if present
        run: bun test || bun run test || echo "no tests"
      - name: Build if present
        run: bun run build || echo "no build"
